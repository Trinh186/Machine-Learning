name: RFM Insight QA
on:
  push:
    branches: [test]
  pull_request:
    branches: [main, test]
  workflow_dispatch:

jobs:
  qa-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            ui_app/requirements.txt
            customer_segmentation/requirements.txt
      - name: Install project dependencies
        run: python -m pip install -r ui_app/requirements.txt -r customer_segmentation/requirements.txt
      - name: Execute safe QA cases
        run: python -m qa.run --gui --report qa/results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-results
          path: qa/results.json
          if-no-files-found: warn